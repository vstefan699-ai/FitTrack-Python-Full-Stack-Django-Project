<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FitTrack Pro{% endblock %}</title>
    <!-- Bootstrap for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
        }
        .navbar {
            background-color: #1a1a1a;
            border-bottom: 2px solid #e63946;
        }
        .navbar-brand {
            color: #e63946 !important;
            font-weight: 700;
            font-size: 1.5rem;
        }
        .nav-username {
            color: #ffffff !important;
        }
        .btn-danger {
            background-color: #e63946;
            border: none;
        }
        .card {
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            color: #ffffff;
        }
        .card:hover {
            border-color: #e63946;
            transition: 0.3s;
        }
        .sidebar {
            background-color: #1a1a1a;
            min-height: 100vh;
            border-right: 2px solid #2a2a2a;
        }
        .sidebar a {
            color: #ffffff;
            text-decoration: none;
            display: block;
            padding: 12px 20px;
            border-radius: 8px;
            margin: 4px 0;
        }
        .sidebar a:hover {
            background-color: #e63946;
            color: #ffffff;
        }
        .sidebar a.active {
            background-color: #e63946;
            color: #ffffff;
        }
        .stat-card {
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            border-left: 4px solid #e63946;
        }
        .stat-card p {
            color: #aaaaaa;
        }
        .stat-card h3 {
            color: #ffffff;
        }
        .text-muted {
            color: #aaaaaa !important;
        }
        .table {
            color: #ffffff;
        }
        .table-dark {
            --bs-table-bg: #1a1a1a;
            --bs-table-striped-bg: #222222;
            --bs-table-hover-bg: #2a2a2a;
            color: #ffffff;
        }
        .form-control, .form-select {
            background-color: #1a1a1a !important;
            color: #ffffff !important;
            border-color: #444444 !important;
        }
        .form-control::placeholder {
            color: #888888 !important;
        }
        .form-label {
            color: #aaaaaa;
        }
        .badge.bg-secondary {
            background-color: #444444 !important;
            color: #ffffff !important;
        }
        /* Flash messages (success = green, error = red) */
        .flash-success, .flash-error {
            color: #ffffff;
        }
        .flash-success {
            background-color: #0a2d0a;
            border: 1px solid #28a745;
        }
        .flash-success i {
            color: #28a745;
        }
        .flash-error {
            background-color: #2d0a0a;
            border: 1px solid #e63946;
        }
        .flash-error i {
            color: #e63946;
        }

        /* ===== Phones & small tablets =====
           767.98px = just below Bootstrap's "md" breakpoint (768px), which is
           exactly where col-md-2 stops being a side column and stacks on top.
           Nothing in here touches the desktop layout. */
        @media (max-width: 767.98px) {
            /* Slightly smaller brand so it fits beside the username + Logout */
            .navbar-brand {
                font-size: 1.2rem;
            }
            /* Sidebar becomes a horizontal menu bar under the navbar */
            .sidebar {
                min-height: auto;              /* no more full-screen-tall sidebar */
                display: flex;                 /* links sit side by side */
                gap: 6px;
                overflow-x: auto;              /* if it ever gets too wide, it swipes */
                padding: 8px !important;       /* beats Bootstrap's p-3, which uses !important */
                border-right: none;
                border-bottom: 2px solid #2a2a2a;
            }
            /* The "MENU" label is pointless in a one-row bar */
            .sidebar > p {
                display: none;
            }
            .sidebar a {
                flex: 0 0 auto;                /* keep each button its natural width */
                white-space: nowrap;           /* "Log Workout" never splits into two lines */
                margin: 0;
                padding: 8px 14px;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fas fa-dumbbell"></i> FitTrack Pro
            </a>
            {% if user.is_authenticated %}
            <div class="ms-auto d-flex align-items-center gap-3">
                <span class="nav-username">
                    <i class="fas fa-user"></i> {{ user.username }}
                    {% if user.is_staff %}
                        <span class="badge bg-danger ms-1">Admin</span>
                    {% endif %}
                </span>
                <a href="{% url 'logout' %}" class="btn btn-danger btn-sm">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
            {% endif %}
        </div>
    </nav>

    <!-- Flash messages: Django only picks the CLASS name; the colours live in the <style> block -->
    {% if messages %}
    <div class="container-fluid px-4 pt-3">
        {% for message in messages %}
        <div class="alert d-flex align-items-center gap-2 {% if message.tags == 'error' %}flash-error{% else %}flash-success{% endif %}">
            <i class="fas {% if message.tags == 'error' %}fa-circle-xmark{% else %}fa-circle-check{% endif %}"></i>
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Page-specific scripts (e.g. the chart on My Progress). Empty on most pages. -->
    {% block extra_js %}
    {% endblock %}
</body>
</html>
