{% comment %}
    Member sidebar, included by every member-side page.
    Same idea as sidebar_trainer.html: highlight by URL *name*, not path.
{% endcomment %}
{% with current=request.resolver_match.url_name %}
<div class="col-md-2 sidebar p-3">
    <p class="text-muted small text-uppercase fw-bold px-2 mt-2">Menu</p>

    <a href="{% url 'user_dashboard' %}"
       class="{% if current == 'user_dashboard' %}active{% endif %}">
        <i class="fas fa-home me-2"></i> Dashboard
    </a>

    <a href="{% url 'workout_log' %}"
       class="{% if current == 'workout_log' %}active{% endif %}">
        <i class="fas fa-plus me-2"></i> Log Workout
    </a>

    <a href="{% url 'my_progress' %}"
       class="{% if current == 'my_progress' %}active{% endif %}">
        <i class="fas fa-chart-line me-2"></i> My Progress
    </a>
</div>
{% endwith %}
